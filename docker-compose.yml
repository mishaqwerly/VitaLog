services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techcare
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d techcare']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - techcare-pgdata:/var/lib/postgresql/data

volumes:
  techcare-pgdata:
